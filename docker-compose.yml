version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: agent-review-backend
    ports:
      - "8001:8000"
    environment:
      - APP_NAME=Agent Document Review
      - APP_ENV=development
      - APP_PORT=8000
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./data/docreview.db
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_MODEL=deepseek-chat
      - DEEPSEEK_BASE_URL=https://api.deepseek.com/v1
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-change-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_PATH=./storage
      - MAX_FILE_SIZE_MB=50
      - MAX_PAGE_COUNT=200
      - CORS_ORIGINS=["http://localhost:3000"]
    volumes:
      - backend_data:/app/data
      - backend_storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/dashboard/stats')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: agent-review-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  backend_data:
  backend_storage:
